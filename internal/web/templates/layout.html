{{define "head"}}
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
:root{--bd:#d8dee6;--blue:#2a6fb0;--bg:#f6f8fa;--warn:#c0392b;--ok:#2e8b57;--amber:#b9770e}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2933;background:var(--bg)}
header{background:#1f3550;color:#fff;padding:12px 22px;display:flex;align-items:center;gap:16px}
header a{color:#cfe0f5;text-decoration:none}
header h1{font-size:18px;margin:0}
main{max-width:1080px;margin:18px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:16px 18px;margin:14px 0}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 6px;color:#33475b}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--bd);padding:5px 8px;text-align:right}
th:first-child,td:first-child,td.l,th.l{text-align:left}
th{background:#eef2f7}
a.btn,button{background:var(--blue);color:#fff;border:0;border-radius:5px;padding:6px 12px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
button.ghost,a.btn.ghost{background:#fff;color:#33475b;border:1px solid var(--bd)}
button.danger{background:var(--warn)}
input,select{padding:5px 7px;border:1px solid var(--bd);border-radius:4px;font-size:13px;width:110px}
input.wide{width:100%}
textarea{width:100%;height:160px;font:12px ui-monospace,monospace;border:1px solid var(--bd);border-radius:4px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.tag.draft{background:#e8eef5;color:#33475b}
.tag.published{background:#dff2e6;color:var(--ok)}
.tag.blocked{background:#fbe3e0;color:var(--warn)}
.tag.error{background:#f3e0f0;color:#7d3c98}
.banner{border:1px solid var(--warn);background:#fdf0ee;color:var(--warn);padding:9px 12px;border-radius:6px;margin:10px 0}
.notice{border:1px solid #d9c48a;background:#fdf6e2;color:var(--amber);padding:9px 12px;border-radius:6px;margin:10px 0}
.okbox{border:1px solid #9ccfaf;background:#eaf7ef;color:var(--ok);padding:9px 12px;border-radius:6px;margin:10px 0}
.chart{width:100%;height:auto;background:#fff}
.ctitle{font-size:13px;fill:#33475b;font-weight:600}
.grid{stroke:#eef1f4;stroke-width:1}
.axis{stroke:#9aa7b2;stroke-width:1}
.tick{font-size:10px;fill:#6b7785}
.ylabel,.rlabel,.legend{font-size:10px;fill:#6b7785}
.rlabel{fill:#33475b}
.muted{color:#6b7785}
.pill{font-size:11px;padding:0 6px;border:1px solid var(--bd);border-radius:8px;color:#556}
.specrow{display:flex;gap:8px;align-items:center;margin:5px 0}
code{background:#eef1f4;padding:1px 4px;border-radius:3px}
</style>
</head>
<body>
<header>
  <h1>动态辨识工场</h1>
  <a href="/">数据集</a>
  <span style="flex:1"></span>
  <form method="post" action="/api/reset" onsubmit="return confirm('确认清空全部数据集与运行？可先用导出保存。')" style="margin:0">
    <button class="ghost" type="submit">清空数据库</button>
  </form>
</header>
<main>
{{end}}
{{define "foot"}}
</main>
</body>
</html>
{{end}}
